

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    restart: unless-stopped
    # Depending on GPU setup, you could add:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Optional helper to pull the model automatically on first start
  ollama-pull:
    image: curlimages/curl:latest
    container_name: ollama-pull
    depends_on:
      - ollama
    command: >
      sh -c "sleep 10 && curl -X POST http://ollama:11434/api/pull -d '{\"name\":\"llama3.2\"}'"
    restart: "no"
