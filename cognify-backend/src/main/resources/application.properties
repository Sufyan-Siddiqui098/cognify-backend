# Application
spring.application.name=cognify-backend
server.port=8082

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/cognify
spring.datasource.username=postgres
spring.datasource.password=123456789
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration


# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# File Storage Configuration (Local Folder)
cognify.storage.base-path=C:/cognify-uploads
cognify.storage.allowed-types=application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain
cognify.storage.max-file-size=52428800

# Async Configuration
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=async-

# JWT Configuration
cognify.jwt.secret=${COGNIFY_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
cognify.jwt.access-expiration=900000
cognify.jwt.refresh-expiration=604800000

# Embedding Configuration (FYP-aligned 768 dimensions)
cognify.embedding.dimensions=768
cognify.ai-service.url=http://localhost:8000

# CORS Configuration
cognify.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Logging
logging.level.root=INFO
logging.level.com.cognify=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
